aid: motivo
name: Motivo
description: >-
  Motivo is the leading managed clinical supervision platform for behavioral
  health organizations. It connects pre-licensed and post-graduate mental
  health professionals with 1,500+ vetted clinical supervisors across all 50
  states, enabling organizations to expand their workforce, reduce burnout, and
  meet licensure requirements. The fully-managed platform handles supervisor
  vetting, compliance and documentation, scheduling, HIPAA-compliant video
  sessions, and payment processing, and includes group supervision, peer
  consultation, webinars, and workforce-development resources. Motivo serves
  behavioral health centers, treatment facilities, health plans, and digital
  health companies. As of this profile Motivo publishes no public developer API,
  SDK, or developer portal; its platform is delivered as a managed SaaS product
  and it consumes third-party APIs (e.g. Google Calendar) internally.
